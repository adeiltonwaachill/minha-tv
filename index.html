<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#04060a">
  <title>Minha.TV | Live TV</title>
  <!-- Biblioteca para tocar os canais ao vivo -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <!-- Arquivo de estilo -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra Superior -->
  <header class="topbar">
    <div class="logo">MINHA<span>.TV</span></div>
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="search" class="search" id="search" placeholder="Buscar canal..." aria-label="Buscar">
    </div>
  </header>

  <!-- Área do Player (Fica fixo no topo) -->
  <section class="player-hero">
    <div class="player-container">
      <div class="video-wrapper" id="videoWrapper">
        <video id="videoPlayer" controls autoplay muted playsinline crossorigin="anonymous"></video>
      </div>
      <div class="player-info">
        <div>
          <div class="now-title" id="playingName">Selecione um canal</div>
          <div class="now-category" id="playingCategory">Live TV</div>
        </div>
        <div class="status-badge" id="playerStatus" style="display:none;">
          <span class="status-dot"></span> AO VIVO
        </div>
      </div>
    </div>
  </section>

  <!-- Área do Catálogo de Canais -->
  <main class="main-content">
    <div class="filters" id="filtersContainer">
      <button class="filter-btn active" data-category="Todos">Todos</button>
    </div>

    <div class="channel-grid" id="channelGrid">
      <div class="empty-state">Carregando canais...</div>
    </div>
  </main>

  <!-- Arquivo de lógica -->
  <script src="app.js"></script>
</body>
</html>
